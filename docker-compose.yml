services:
  # PostgreSQL Database
  postgres:
    image: postgres:16
    container_name: hirelink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hirelink_db
      POSTGRES_USER: hirelink
      POSTGRES_PASSWORD: password
    ports:
      # Host port is configurable to avoid clashing with a locally-installed
      # Postgres on 5432: `POSTGRES_HOST_PORT=5433 docker compose up`.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hirelink -d hirelink_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hirelink-network

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hirelink-backend
    restart: unless-stopped
    environment:
      # PG* variables match the placeholders in application.properties.
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=hirelink_db
      - PGUSER=hirelink
      - PGPASSWORD=password
      - JWT_SECRET=${JWT_SECRET:-bG9jYWwtZGV2LW9ubHktand0LXNlY3JldC1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi1taW4tMjU2LWJpdHM=}
      - CORS_ORIGINS=http://localhost:3000,http://localhost
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - hirelink-network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: hirelink-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hirelink-network

volumes:
  postgres_data:
    driver: local

networks:
  hirelink-network:
    driver: bridge
