# Rendered at container start by the nginx image's envsubst entrypoint
# (/etc/nginx/templates/*.template -> /etc/nginx/conf.d/). ${PORT} is the only
# env var substituted; nginx vars like $uri are left intact.
server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # SPA fallback: client-side routes (e.g. deep links, refresh) -> index.html.
    # The frontend calls the backend DIRECTLY via the baked VITE_API_BASE_URL,
    # so there is no /api proxy here (that was only for docker-compose).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache fingerprinted static assets.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
